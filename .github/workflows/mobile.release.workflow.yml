name: MOBILE-RELEASE

on:
  workflow_dispatch:

defaults:
  run:
    # Default to commands running in the mobile folder
    working-directory: ./mobile

# This workflow follows follows a fan-out structure where we first
# build the generic Klimate app and then process it for each white
# label output:
#
# 1. cache-dependencies
# 2. build-android
#    build-ios
# 3. white-label [demo]
#    white-label [intellicomfort]
#    ...

jobs:
  # Caches the dependencies which can be shared by the later jobs in
  # this workflow

  cache-dependencies:
    name: Cache common dependencies
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: "~14"
          cache: "yarn"
          cache-dependency-path: "mobile/yarn.lock"

      # It seems like the "best practice" is to cache yarn's internal
      # cache directory as opposed to caching the node_modules
      # directory; however, in our usage we spend most of the time
      # installing dependencies in the linking step. This means we
      # don't get as much out of persisting the yarn cache.
      # Experimentally caching the node_modules directory has worked
      # well. 🤷

      - name: Set up node_modules cache
        uses: actions/cache@v2
        id: node_modules-cache
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('mobile/yarn.lock') }}

      # We only run yarn in this first job and rely on the cache
      # actually being shared across the subsequen jobs

      - name: Install yarn dependencies
        if: steps.node_modules-cache.outputs.cache-hit != 'true'
        run: yarn --frozen-lockfile --prefer-offline

  # Build the generic Klimate Android app that will be used later by
  # the white labeling steps

  build-android:
    name: Build Android
    runs-on: macos-latest
    needs: [cache-dependencies]

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/mobile/android/Gemfile

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: "~14"

      - name: Restore node_modules cache
        uses: actions/cache@v2
        id: node_modules-cache
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('mobile/yarn.lock') }}

      - name: Set up Gradle cache
        uses: actions/cache@v2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install required command line utilities
        run: brew install xmlstarlet yq

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7.3"
          bundler-cache: true

      - uses: maierj/fastlane-action@v2.0.1
        with:
          lane: "build_aab"
          subdirectory: "mobile/android"

      - name: Terminate the gradle daemon
        run: gradle --stop

      # This is really just so that the artifact can be downloaded as klimate.aab
      - name: Rename the aab
        run: mv android/app/build/outputs/bundle/release/{app-release,klimate}.aab

      - uses: actions/upload-artifact@v2
        with:
          name: klimate.aab
          path: mobile/android/app/build/outputs/bundle/release/klimate.aab

  # Build the generic Klimate iOS app that will be used later by the
  # white labeling steps

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [cache-dependencies]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/mobile/ios/Gemfile

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: "~14"

      - name: Restore node_modules cache
        uses: actions/cache@v2
        id: node_modules-cache
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('mobile/yarn.lock') }}

      - name: Set up cocoapods cache
        uses: actions/cache@v2
        id: cocoapods-cache
        with:
          path: mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install cocoapods dependencies
        run: cd ios && pod install

      # This comes from the GitHub Actions guide on signing for iOS:
      # https://docs.github.com/en/actions/guides/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      #
      # We don't _actually_ care about the signing of this
      # intermediate build, but it seems tricky (and maybe impossible)
      # to generate an .ipa without a valid code signing setup.
      - name: Install the Apple certificate and provisioning profile
        env:
          KLIMATE_BUILD_CERTIFICATE_BASE64: ${{ secrets.KLIMATE_BUILD_CERTIFICATE_BASE64 }}
          KLIMATE_P12_PASSWORD: ${{ secrets.KLIMATE_P12_PASSWORD }}
          KLIMATE_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.KLIMATE_BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$KLIMATE_BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$KLIMATE_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$KLIMATE_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7.3"
          bundler-cache: true

      - uses: maierj/fastlane-action@v2.0.1
        with:
          lane: "build_ipa"
          subdirectory: "mobile/ios"

      - uses: actions/upload-artifact@v2
        with:
          name: klimate.ipa
          path: mobile/ios/build/klimate.ipa

  # Run the white labeling process using the generated klimate.ipa as
  # the starting point

  white-label:
    name: White label apps
    runs-on: macos-latest

    # Each app we want to generate a white labeled app artifact for
    # should be added to this list (see note below about declaring
    # secrets for each app as well!)

    strategy:
      matrix:
        app: [demo, intellicomfort]

    # Block this job until we have both the Android + iOS artifacts

    needs: [build-android, build-ios]

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: "~14"

      - name: Restore node_modules cache
        uses: actions/cache@v2
        id: node_modules-cache
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('mobile/yarn.lock') }}

      - name: Install required command line utilities
        run: brew install apktool bundletool imagemagick xmlstarlet yq

      - name: Extract the app_config/signing directories
        env:
          # Secrets must be required declaratively so we'll need to
          # duplicate this pattern for each app (i.e. we can't
          # leverage the matrix behavior to load the secrets)
          #
          # These secrets were generated by generating a compressed
          # tarball of the complete signing directory structure for
          # each app. E.g.:
          # tar cz signing | base64 | pbcopy
          DEMO_SIGNING_BASE64: ${{ secrets.DEMO_SIGNING_BASE64 }}
          INTELLICOMFORT_SIGNING_BASE64: ${{ secrets.INTELLICOMFORT_SIGNING_BASE64 }}
          MATRIX_APP: ${{ matrix.app }}
        run: |
          APP_CONFIG_DIR=./app_config/${MATRIX_APP}

          # Upcase the app name so we can use it in the variable interpolation below
          APP=$(echo ${MATRIX_APP} | tr '[:lower:]' '[:upper:]')
          echo -n $(eval echo  "\$${APP}_SIGNING_BASE64") | base64 --decode | tar xz -C ${APP_CONFIG_DIR}

      # White label the Android app

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7.3"
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/mobile/android/Gemfile

      - uses: actions/download-artifact@v2
        with:
          name: klimate.aab
          path: mobile/android/app/build/outputs/bundle/release/

      - name: Rename the aab
        run: mv android/app/build/outputs/bundle/release/{klimate,app-release}.aab

      - uses: maierj/fastlane-action@v2.0.1
        with:
          lane: "build"
          options: '{"app": "${{ matrix.app }}", "skip_build": true, "sign_app": true}'
          subdirectory: "mobile/android"
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/mobile/android/Gemfile

      - uses: actions/upload-artifact@v2
        with:
          name: ${{ matrix.app }}.aab
          path: mobile/android/app/build/outputs/bundle/release/${{ matrix.app }}/${{ matrix.app }}.aab

      - uses: actions/upload-artifact@v2
        with:
          name: ${{ matrix.app }}.apk
          path: mobile/android/app/build/outputs/bundle/release/${{ matrix.app }}/${{ matrix.app }}.apk

      # White label the iOS app

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7.3"
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/mobile/ios/Gemfile

      - uses: actions/download-artifact@v2
        with:
          name: klimate.ipa
          path: mobile/ios/build/

      - uses: maierj/fastlane-action@v2.0.1
        with:
          lane: "build"
          options: '{"app": "${{ matrix.app }}", "skip_build": true, "sign_app": true}'
          subdirectory: "mobile/ios"
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/mobile/ios/Gemfile

      - uses: actions/upload-artifact@v2
        with:
          name: ${{ matrix.app }}.ipa
          path: mobile/ios/build/${{ matrix.app }}/changes/${{ matrix.app }}.ipa
