# This is a basic workflow to help you get started with Actions
name: INTELLICOMFORT-API-CI

# Triggers the workflow in a few conditions
# 1. Every change to main (a merged PR will result in a push)
# 2. When a pull request created / updated
# 3. Manually
on:
  push:
    branches: [main]
    paths: ["intellicomfort-api/**", "ayla-client/**", "graph/**"]
  pull_request:
    types: [opened, reopened, synchronize]
    paths: ["intellicomfort-api/**", "ayla-client/**", "graph/**"]
  workflow_dispatch:

defaults:
  run:
    # Default to commands running in the intellicomfort-api folder
    working-directory: ./intellicomfort-api

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Installs dependencies
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Set the required environment variables
    env:
      JWT_SIG_KEY: sig
      JWT_ENCRYPT_KEY: encrypt
      PASSWORD_SALT: nacl
      REVIEWS_ENABLED: true
      REVIEW_PROBABILITY: 1

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Build ayla-client
      - uses: actions/setup-node@v2
        with:
          node-version: "~14"
          cache: "yarn"
          cache-dependency-path: "ayla-client/yarn.lock"

      - run: yarn --frozen-lockfile --prefer-offline
        working-directory: ./ayla-client

      - run: yarn build-ts
        working-directory: ./ayla-client

      - uses: actions/setup-node@v2
        with:
          node-version: "~14"
          cache: "yarn"
          cache-dependency-path: "intellicomfort-api/yarn.lock"

      - name: Install yarn dependencies from cache
        run: yarn --frozen-lockfile --prefer-offline

      - name: Build Graph
        run: |
          yarn build-graph
          git diff --quiet
          if [ $? -eq 1 ]; then
            echo "Schema changes detected, they should be validated and comitted"
            exit 1;
          fi

      - name: Build Typescript
        run: yarn build-ts

      - name: Run ESLint
        run: yarn lint

      - name: Run Jest
        run: yarn test
