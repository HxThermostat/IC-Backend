overwrite: true
schema: ${SCHEMA_PATH:../graph/schema/**/*.graphql}
documents: []
generates:
  ./src/schema/resolvers-types.ts:
    plugins:
      - "typescript"
      - "typescript-resolvers"
    config:
      contextType: ../server/context#AppContext
      mappers:
        Controller: ./mappers#ControllerMapper
        DualSetpoint: ./mappers#DualSetpointMapper
        FaultLogLabel: ./mappers#FaultLogLabelMapper
        FaultLogLabelAndDescription: ./mappers#FaultLogLabelAndDescriptionMapper
        FeatureMap: ./mappers#FeatureMapMapper
        Location: ./mappers#LocationMapper
        Mode: ./mappers#ModeMapper
        PushToken: ./mappers#PushTokenMapper
        ScheduleDay: ./mappers#ScheduleDayMapper
        ScheduleEvent: ./mappers#ScheduleEventMapper
        Schedule: ./mappers#ScheduleMapper
        SingleSetpoint: ./mappers#SingleSetpointMapper
        TemperaturePreset: ./mappers#TemperaturePresetMapper
        User: ./mappers#UserMapper
      useIndexSignature: true
    hooks:
      afterOneFileWrite:
        - yarn prettier --ignore-path /dev/null --write
  ./src/graphql.schema.json:
    plugins:
      - "introspection"
    hooks:
      afterOneFileWrite:
        - yarn prettier --ignore-path /dev/null --write
